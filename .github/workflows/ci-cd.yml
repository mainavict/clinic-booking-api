name: CI/CD Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    # NEW: Provide dummy environment variables so Pydantic Settings doesn't crash on import
    env:
      DATABASE_URL: "postgresql+asyncpg://user:password@localhost:5432/testdb"
      SENTRY_DSN: "https://dummy@dummy.ingest.sentry.io/0"
      MAX_DAYS_IN_ADVANCE: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run pytest suite
        run: |
          pytest tests/ -v

  deploy:
    name: Deploy to Render
    needs: test
    # Only run deploy on push to main branch (after a PR is merged)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}